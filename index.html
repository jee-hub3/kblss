<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/kbls-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    기본 메타값. JS를 실행하지 않는 크롤러가 보는 것이 여기까지다.
    React 19에서는 react-helmet-async가 자체 DOM 조작 대신 React의 네이티브
    메타데이터 호이스팅을 쓰기 때문에, 여기 있는 정적 태그를 알아서 회수하지 못한다.
    그래서 data-rh="true"를 표식으로 달아두고 src/components/Seo.jsx가 마운트될 때
    한 번 걷어낸다. 이 표식을 지우면 og:title 등이 두 벌씩 남고, 크롤러는 보통
    먼저 나온 태그(= 이 기본값)를 읽으므로 페이지별 값이 무시된다.
  -->
  <title data-rh="true">KBLs — Key Bridge Leaders</title>
  <meta data-rh="true" name="description"
    content="실행과 협업으로 성장하는 실무형 인재들의 랩실. 공모전·프로젝트·스터디로 증명합니다." />
  <link data-rh="true" rel="canonical" href="https://kblss.vercel.app/" />

  <meta data-rh="true" property="og:type" content="website" />
  <meta data-rh="true" property="og:site_name" content="KBLs" />
  <meta data-rh="true" property="og:locale" content="ko_KR" />
  <meta data-rh="true" property="og:title" content="KBLs — Key Bridge Leaders" />
  <meta data-rh="true" property="og:description"
    content="실행과 협업으로 성장하는 실무형 인재들의 랩실. 공모전·프로젝트·스터디로 증명합니다." />
  <meta data-rh="true" property="og:url" content="https://kblss.vercel.app/" />
  <meta data-rh="true" property="og:image" content="https://kblss.vercel.app/og-image.png" />
  <meta data-rh="true" property="og:image:width" content="1200" />
  <meta data-rh="true" property="og:image:height" content="630" />
  <meta data-rh="true" property="og:image:alt" content="KBLs — Key Bridge Leaders" />

  <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  <meta data-rh="true" name="twitter:title" content="KBLs — Key Bridge Leaders" />
  <meta data-rh="true" name="twitter:description"
    content="실행과 협업으로 성장하는 실무형 인재들의 랩실. 공모전·프로젝트·스터디로 증명합니다." />
  <meta data-rh="true" name="twitter:image" content="https://kblss.vercel.app/og-image.png" />

  <!-- 본문 한글 서체(Pretendard dynamic-subset).
       CSS는 self-host(public/fonts/, jsdelivr v1.3.9 원본에서 폰트 URL만 절대경로로 치환),
       woff2는 jsdelivr CDN에서 받는다. 서드파티 CSS 렌더 차단(~1.5s)을 같은 오리진의
       소형 요청으로 바꾸고, 폰트 발견 시점을 앞당겨 React 첫 페인트 전에 로드를 끝낸다.
       비차단(preload→onload) 방식은 폰트 스왑 리플로우로 CLS 0.69가 발생해 쓰지 않는다.
       CLS 0 유지가 이 블로킹 링크의 존재 이유다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="/fonts/pretendard-dynamic-subset.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
