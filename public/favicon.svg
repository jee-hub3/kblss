<!-- 파비콘 전용 단순화 자산.
     kbls-logo.svg(624×689, 드롭섀도 필터 + 바별 그라데이션)를 축소하면
     16px에서 뭉개져서, 같은 5-bar 웨이브폼 형태를 정사각 viewBox에
     굵은 바 + 단색(brand-accent #2563eb)으로 다시 그렸다.
     로고 원본은 GNB 데스크톱에서 계속 쓴다. -->
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="35" width="14" height="30" rx="7" fill="#2563eb"/>
  <rect x="21.5" y="19" width="14" height="62" rx="7" fill="#2563eb"/>
  <rect x="43" y="0" width="14" height="100" rx="7" fill="#2563eb"/>
  <rect x="64.5" y="19" width="14" height="62" rx="7" fill="#2563eb"/>
  <rect x="86" y="35" width="14" height="30" rx="7" fill="#2563eb"/>
</svg>
